name: patched-tree-81238

# Builds Go master at a pinned commit with patches-81238/ applied (Go CL
# 828724, the exception stack reserve fix for golang/go#81238), then runs the
# runtime tests it adds and the short runtime suite. Several identical jobs
# per image, because runner hardware varies and only some hosts have AVX-512
# or AMX; windows-11-arm exercises the arm64 CONTEXT_XSTATE path on SVE.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Jobs per runner image"
        default: "4"
      base:
        description: "go.googlesource.com/go commit to patch"
        default: "165bc6e7b86782c04ed7475199fe093b2f0f22fc"
      apply_patch:
        description: "Apply patches-81238/ (false = test the base commit as is)"
        type: boolean
        default: true
      only:
        description: "If set, run only this runtime test regexp in a loop, or 'gdbdirect' to run gdb on the TestGdbAutotmpTypes program directly (skips the other test steps)"
        default: ""
      loops:
        description: "Iterations for 'only', each with a 3-minute timeout"
        default: "10"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - id: m
        run: echo "idx=$(seq -s, 1 ${{ inputs.runs }} | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, windows-11-arm]
        idx: ${{ fromJSON(needs.plan.outputs.idx) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - name: hardware
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, Architecture, NumberOfLogicalProcessors | Format-List
          [System.Environment]::OSVersion.VersionString
          go version
          cd cpuinfo; go run .
      - name: fetch go at base commit
        run: |
          git init go
          cd go
          git fetch --depth=1 https://go.googlesource.com/go ${{ inputs.base }}
          git checkout -q FETCH_HEAD
          if ('${{ inputs.apply_patch }}' -eq 'false') { echo 'base commit, no patch'; exit 0 }
          $p = '../patches-81238/0001-runtime-size-the-Windows-exception-stack-reserve.patch'
          git apply --stat $p
          git apply $p
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: native arm64 C toolchain
        # The image's gcc targets x86, so cgo and DLL tests cannot build on
        # arm64. Pinned llvm-mingw release, checked against its published
        # SHA-256, put first on PATH as gcc.
        if: ${{ matrix.os == 'windows-11-arm' }}
        run: |
          $v = '20261117'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-aarch64.zip" -OutFile $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($h -ne 'c7f56de1d7aca15196c19083a799205390397b8b87a825aec3485e1e4f3c2cdd') { throw "llvm-mingw checksum mismatch: $h" }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw-$v-ucrt-aarch64/bin"
          Get-ChildItem $bin -Filter '*gcc*.exe' | Select-Object -ExpandProperty Name
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) { Copy-Item (Join-Path $bin 'aarch64-w64-mingw32-gcc.exe') (Join-Path $bin 'gcc.exe') }
          if (-not (Test-Path (Join-Path $bin 'g++.exe'))) { Copy-Item (Join-Path $bin 'aarch64-w64-mingw32-g++.exe') (Join-Path $bin 'g++.exe') }
          & (Join-Path $bin 'gcc.exe') --version
          & (Join-Path $bin 'gcc.exe') -dumpmachine
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$(Join-Path $bin 'gcc.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$(Join-Path $bin 'g++.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: make.bat
        id: build
        run: |
          $env:GOROOT_BOOTSTRAP = (go env GOROOT)
          cd go/src
          .\make.bat
      - name: exception reserve tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.only == '' }}
        run: |
          cd go/src
          ..\bin\go.exe test -count=1 -v -run 'Exception|G0Stack|Vectored' runtime
      - name: exception probe under patched runtime
        # amd64 assembly only.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.os != 'windows-11-arm' && inputs.only == '' }}
        run: |
          cd excprobe
          ..\go\bin\go.exe run .
      - name: runtime short tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.only == '' }}
        run: |
          cd go/src
          # The gdb tests hang on these images until the 10-minute timeout,
          # which hides every runtime result after them. They do not touch
          # exception dispatch, so they are skipped here.
          ..\bin\go.exe test -short -count=1 -skip '^TestGdb' runtime
      - name: isolated test loop
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.only != '' && inputs.only != 'gdbdirect' }}
        env:
          ONLY: ${{ inputs.only }}
          LOOPS: ${{ inputs.loops }}
        run: |
          $env:GOROOT = (Resolve-Path go).Path
          $env:PATH = "$env:GOROOT\bin;$env:PATH"
          cd go/src/runtime
          ..\..\bin\go.exe test -c -o rt.test.exe .
          gdb --version | Select-Object -First 1
          $run = '-test.run=' + $env:ONLY
          $pass = 0; $fail = 0; $hang = 0
          for ($i = 1; $i -le [int]$env:LOOPS; $i++) {
            $t0 = Get-Date
            $out = & .\rt.test.exe $run '-test.v' '-test.timeout=3m' 2>&1 | Out-String
            $secs = [int]((Get-Date) - $t0).TotalSeconds
            if ($out -match 'test timed out') { $hang++; "iter $i HANG after $secs s"; ($out -split "`n" | Select-String -Pattern 'running tests|gdb|exec' | Select-Object -First 12) }
            elseif ($LASTEXITCODE -eq 0) { $pass++; "iter $i pass $secs s" }
            else { $fail++; "iter $i FAIL $secs s"; $out.Substring([Math]::Max(0, $out.Length - 1500)) }
          }
          "RESULT only=$env:ONLY pass=$pass fail=$fail hang=$hang"
      - name: gdb direct loop
        # TestGdbAutotmpTypes's program and gdb command line, run outside the
        # test harness so a hang shows how far gdb got. amd64 only: the
        # image's gdb is x86.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.only == 'gdbdirect' && matrix.os != 'windows-11-arm' }}
        env:
          LOOPS: ${{ inputs.loops }}
        run: |
          $goroot = (Resolve-Path go).Path
          cd gdbprobe
          $env:GOTOOLCHAIN = 'local'
          & "$goroot\bin\go.exe" build '-gcflags=all=-N -l' -o a.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gdb --version | Select-Object -First 1
          $exe = (Resolve-Path a.exe).Path
          $gdbargs = "-nx -batch -iex `"add-auto-load-safe-path $goroot\src\runtime`" -ex `"set startup-with-shell off`" -ex `"set scheduler-locking off`" -ex `"break main.main`" -ex run -ex step -ex `"info types astruct`" `"$exe`""
          $pass = 0; $fail = 0; $hang = 0
          for ($i = 1; $i -le [int]$env:LOOPS; $i++) {
            $o = Join-Path $env:RUNNER_TEMP "gdb-$i.out"; $e = Join-Path $env:RUNNER_TEMP "gdb-$i.err"
            $t0 = Get-Date
            $p = Start-Process gdb -ArgumentList $gdbargs -RedirectStandardOutput $o -RedirectStandardError $e -PassThru -NoNewWindow
            $done = $p.WaitForExit(60000)
            $secs = [int]((Get-Date) - $t0).TotalSeconds
            if (-not $done) {
              $hang++
              "iter $i HANG after $secs s"
              $a = Get-Process -Name a -ErrorAction SilentlyContinue
              if ($a) { $c1 = $a.CPU; Start-Sleep 3; $a.Refresh(); "  debuggee alive, threads=$($a.Threads.Count), cpu $c1 -> $($a.CPU) s" } else { "  debuggee not running" }
              "  --- gdb stdout"; Get-Content $o -Tail 25
              "  --- gdb stderr"; Get-Content $e -Tail 10
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Get-Process -Name a -ErrorAction SilentlyContinue | Stop-Process -Force
            } elseif ((Get-Content $o -Raw) -match 'map<string,main.astruct>') { $pass++ }
            else { $fail++; "iter $i FAIL $secs s exit $($p.ExitCode)"; Get-Content $o -Tail 15; Get-Content $e -Tail 5 }
          }
          "RESULT gdbdirect pass=$pass fail=$fail hang=$hang"
